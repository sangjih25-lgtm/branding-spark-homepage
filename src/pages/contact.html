<!-- title: 문의하기 | 브랜딩스파크 -->
<!-- desc: 크리에이터 지원, 브랜드 제휴, 플랫폼 입점, 홈페이지·쇼핑몰 제작 문의. 영업일 기준 24시간 내 답변. -->
<!-- active: contact -->
<!-- bodyclass: dark-top -->
<section class="contact" style="padding-top:170px">
  <div class="wrap">
    <div class="cinfo">
      <span class="eyebrow rv">Contact</span>
      <h2 class="sec rv">시작해 <span class="hl">볼까요?</span></h2>
      <p class="lead rv">크리에이터 지원, 브랜드 제휴, 플랫폼 입점, 홈페이지·쇼핑몰 제작 — 무엇이든 환영합니다. 영업일 기준 24시간 내에 답변드립니다.</p>
      <div class="cline rv">
        <div><svg class="ic"><use href="#i-mail"/></svg>info@bspark.co.kr</div>
        <div><svg class="ic"><use href="#i-phone"/></svg>010-8660-3293 · Fax 02-3477-3293</div>
        <div><svg class="ic"><use href="#i-pin"/></svg>서울특별시 서초구 방배로60, 3층</div>
        <div><svg class="ic"><use href="#i-clock"/></svg>평일 09:00 – 18:00 (주말·공휴일 휴무)</div>
      </div>
    </div>
    <form class="form rv" id="cform">
      <h3>문의하기</h3>
      <div class="frow">
        <div class="fg"><label>이름 / 채널명 · 회사명 *</label><input name="name" required placeholder="홍길동 / 채널명"></div>
        <div class="fg"><label>연락처 *</label><input name="phone" required placeholder="010-0000-0000"></div>
      </div>
      <div class="frow">
        <div class="fg"><label>이메일 *</label><input type="email" name="email" required placeholder="you@example.com"></div>
        <div class="fg"><label>문의 유형 *</label>
          <select name="type" id="ftype" required>
            <option value="">선택해 주세요</option>
            <option>크리에이터 지원</option>
            <option>브랜드 제휴</option>
            <option>플랫폼 입점 (제조사·자사브랜드)</option>
            <option>홈페이지 · 쇼핑몰 · 시스템 제작</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <div class="fg"><label>문의 내용 *</label><textarea name="message" required placeholder="채널 링크, 브랜드·상품 소개, 또는 만들고 싶은 사이트에 대해 편하게 남겨주세요."></textarea></div>
      <label class="agree"><input type="checkbox" id="fagree" required><span><a onclick="openPP(event)">개인정보 수집·이용</a>에 동의합니다. (문의 응대 목적, 목적 달성 시 파기)</span></label>
      <button class="btn pri" type="submit" id="fbtn">문의 보내기 <svg class="ic"><use href="#i-arrow"/></svg></button>
      <p class="fmsg" id="fmsg"></p>
    </form>
  </div>
</section>
