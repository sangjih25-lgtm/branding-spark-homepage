<script>
const CONFIG = { email: 'info@bspark.co.kr', web3formsKey: '' };

// marquee
const mq = document.getElementById('mq1');
if (mq) {
  const words = ['BRANDINGSPARK','CREATOR × COMMERCE','콘텐츠가 매출이 되는 곳','MCN','플랫폼 · 홈페이지 제작','투명한 정산','제조사 직계약'];
  const bolt = '<svg class="ic"><use href="#i-bolt"/></svg>';
  mq.innerHTML = (words.map(w=>`<span>${w}</span>${bolt}`).join('')).repeat(4);
}

// rotating word
const flip = document.getElementById('flip');
if (flip) { const ws = [...flip.children]; let i = 0;
  setInterval(() => { ws[i].classList.remove('on'); i = (i+1)%ws.length; ws[i].classList.add('on'); }, 2200); }

// cursor
const cur = document.getElementById('cur');
addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
document.querySelectorAll('a,button,[data-big],summary').forEach(el => {
  el.addEventListener('mouseenter', () => cur.classList.add('big'));
  el.addEventListener('mouseleave', () => cur.classList.remove('big'));
});

// nav / progress / totop
const nav = document.getElementById('nav'), prog = document.getElementById('prog'), totop = document.getElementById('totop');
const onScroll = () => {
  const h = document.documentElement;
  nav.classList.toggle('on', h.scrollTop > 40);
  prog.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
  totop.classList.toggle('on', h.scrollTop > 600);
};
addEventListener('scroll', onScroll); onScroll();
totop.onclick = () => scrollTo({top:0, behavior:'smooth'});
const menu = document.getElementById('menu');
document.getElementById('burger').onclick = () => menu.classList.toggle('open');
menu.querySelectorAll('a').forEach(a => a.onclick = () => menu.classList.remove('open'));

// reveal
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold:.1});
document.querySelectorAll('.rv').forEach(el => io.observe(el));

// spark burst
addEventListener('click', e => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('span'); s.className = 'spark';
    s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/></svg>';
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*50;
    s.style.left = e.clientX+'px'; s.style.top = e.clientY+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px');
    s.style.setProperty('--rot', (Math.random()*180-90)+'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  }
});

// privacy modal
const pp = document.getElementById('ppModal');
function openPP(e){ if(e) e.preventDefault(); pp.classList.add('on'); }
function closePP(){ pp.classList.remove('on'); }
pp.addEventListener('click', e => { if(e.target === pp) closePP(); });

// contact form (contact.html)
const cform = document.getElementById('cform');
if (cform) {
  const params = new URLSearchParams(location.search);
  const sel = document.getElementById('ftype');
  if (params.get('type') && sel) sel.value = params.get('type');
  cform.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, btn = document.getElementById('fbtn'), msg = document.getElementById('fmsg');
    const d = Object.fromEntries(new FormData(f));
    if (CONFIG.web3formsKey) {
      btn.disabled = true; btn.textContent = '전송 중...';
      try {
        const r = await fetch('https://api.web3forms.com/submit', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({access_key: CONFIG.web3formsKey, subject:`[홈페이지 문의] ${d.type} - ${d.name}`, ...d})});
        if (!(await r.json()).success) throw 0;
        msg.style.color = '#1a9b50'; msg.textContent = '문의가 접수되었습니다. 영업일 기준 24시간 내 답변드리겠습니다.';
        msg.style.display = 'block'; f.reset();
      } catch {
        msg.style.color = '#d33'; msg.textContent = '전송에 실패했습니다. ' + CONFIG.email + ' 로 직접 메일 부탁드립니다.';
        msg.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = '문의 보내기';
    } else {
      const body = `문의 유형: ${d.type}%0D%0A이름/채널명: ${d.name}%0D%0A연락처: ${d.phone}%0D%0A이메일: ${d.email}%0D%0A%0D%0A${encodeURIComponent(d.message)}`;
      location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent('[홈페이지 문의] '+d.type+' - '+d.name)}&body=${body}`;
    }
  });
}
</script>
</body>
</html>
