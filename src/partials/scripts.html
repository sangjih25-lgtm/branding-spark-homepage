<script>
const CONFIG = { email: 'info@bspark.co.kr', web3formsKey: '' };

// marquee
const mq = document.getElementById('mq1');
if (mq) {
  const words = ['BRANDINGSPARK','CREATOR × COMMERCE','콘텐츠가 매출이 되는 곳','MCN','플랫폼 · 홈페이지 제작','투명한 정산','제조사 직계약'];
  const bolt = '<svg class="ic"><use href="#i-bolt"/></svg>';
  mq.innerHTML = (words.map(w=>`<span>${w}</span>${bolt}`).join('')).repeat(4);
}

// rotating word
const flip = document.getElementById('flip');
if (flip) { const ws = [...flip.children]; let i = 0;
  setInterval(() => { ws[i].classList.remove('on'); i = (i+1)%ws.length; ws[i].classList.add('on'); }, 2200); }

// cursor
const cur = document.getElementById('cur');
addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
document.querySelectorAll('a,button,[data-big],summary').forEach(el => {
  el.addEventListener('mouseenter', () => cur.classList.add('big'));
  el.addEventListener('mouseleave', () => cur.classList.remove('big'));
});

// nav / progress / totop
const nav = document.getElementById('nav'), prog = document.getElementById('prog'), totop = document.getElementById('totop');
const onScroll = () => {
  const h = document.documentElement;
  nav.classList.toggle('on', h.scrollTop > 40);
  prog.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
  totop.classList.toggle('on', h.scrollTop > 600);
};
addEventListener('scroll', onScroll); onScroll();
totop.onclick = () => scrollTo({top:0, behavior:'smooth'});
const menu = document.getElementById('menu');
document.getElementById('burger').onclick = () => menu.classList.toggle('open');
menu.querySelectorAll('a').forEach(a => a.onclick = () => menu.classList.remove('open'));

// reveal
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold:.1});
document.querySelectorAll('.rv').forEach(el => io.observe(el));

// spark burst
addEventListener('click', e => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('span'); s.className = 'spark';
    s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/></svg>';
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*50;
    s.style.left = e.clientX+'px'; s.style.top = e.clientY+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px');
    s.style.setProperty('--rot', (Math.random()*180-90)+'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  }
});

// privacy modal
const pp = document.getElementById('ppModal');
function openPP(e){ if(e) e.preventDefault(); pp.classList.add('on'); }
function closePP(){ pp.classList.remove('on'); }
pp.addEventListener('click', e => { if(e.target === pp) closePP(); });

// ── 문의 폼 (contact.html) — HUB(hub.bspark.co.kr) 접수함으로 직접 저장. 유형은 HUB 로그인 화면 모달과 동일한 5종.
const cform = document.getElementById('cform');
if (cform) {
  const API = 'https://hub.bspark.co.kr/api/inquiry';
  const $ = (id) => document.getElementById(id);
  const KIND_HELP = {
    '공급사': '제조사·자사브랜드 입점 문의입니다. 상품·회사 제안서를 첨부해 주세요. 접수 즉시 입점 절차 안내 메일이 발송됩니다.',
    '셀러': '크리에이터·셀러 입점 문의입니다. 채널 링크와 간단한 소개를 남겨주세요.',
    '제휴': '브랜드 캠페인·협찬·광고 문의입니다. 상품군과 목표를 적어주시면 진행 방식과 견적을 제안드립니다.',
    '제작': '홈페이지·쇼핑몰·업무 시스템 제작 문의입니다. 만들고 싶은 것과 참고 사이트를 알려주세요.',
    '기타': '그 밖의 문의는 자유롭게 남겨주세요.',
  };
  const PLACE = {
    '공급사': '취급 품목, 판매 채널, 문의 사항 등을 자유롭게 적어주세요.',
    '셀러': '주력 콘텐츠, 관심 상품군, 문의 사항 등을 적어주세요.',
    '제휴': '브랜드·상품군, 캠페인 목표, 예산 범위·일정 등을 자유롭게 적어주세요.',
    '제작': '만들고 싶은 사이트/시스템, 필요한 기능, 희망 일정 등을 적어주세요.',
    '기타': '문의 내용을 자유롭게 적어주세요.',
  };
  const KINDS = ['공급사','셀러','제휴','제작','기타'];
  let kind = '공급사';
  const snsSel = new Set();
  let files = [];

  function setKind(k) {
    kind = KINDS.includes(k) ? k : '공급사';
    document.querySelectorAll('#kinds button').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
    KINDS.forEach(x => document.querySelectorAll('.only-' + x).forEach(el => el.hidden = (x !== kind)));
    document.querySelectorAll('.not-셀러').forEach(el => el.hidden = (kind === '셀러'));
    $('khelp').textContent = KIND_HELP[kind];
    $('lblCompany').textContent = kind === '셀러' ? '채널명 또는 성함 *' : kind === '제휴' ? '회사명(기관명) *' : (kind === '제작' || kind === '기타') ? '회사명 또는 성함 *' : '업체명(상호) *';
    $('company').placeholder = kind === '셀러' ? '예: 뷰티크루 / 홍길동' : kind === '제휴' ? '회사명 또는 기관명' : (kind === '제작' || kind === '기타') ? '회사명 또는 성함' : '(주)브랜딩스파크';
    $('message').placeholder = PLACE[kind];
  }
  document.querySelectorAll('#kinds button').forEach(b => b.addEventListener('click', () => setKind(b.dataset.kind)));
  // 다른 페이지에서 ?type=공급사|셀러|제휴|제작|기타 로 유형 프리셋 (구 값도 매핑)
  const params = new URLSearchParams(location.search);
  const t = params.get('type') || '';
  const legacy = { '크리에이터 지원': '셀러', '브랜드 제휴': '제휴', '플랫폼 입점 (제조사·자사브랜드)': '공급사', '홈페이지 · 쇼핑몰 · 시스템 제작': '제작' };
  setKind(legacy[t] || t);

  document.querySelectorAll('#sns button').forEach(b => b.addEventListener('click', () => { const v = b.textContent.trim(); snsSel.has(v) ? snsSel.delete(v) : snsSel.add(v); b.classList.toggle('on', snsSel.has(v)); }));

  // 첨부 (공급사)
  const MAX = 20 * 1024 * 1024;
  function renderFiles() {
    $('filelist').innerHTML = files.map((f, i) => `<div><span>📄 ${f.name} <small>(${(f.size/1024/1024).toFixed(1)}MB)</small></span><button type="button" data-i="${i}">삭제</button></div>`).join('') + (files.length ? `<div class="cnt">${files.length}개 첨부됨 (최대 10개)</div>` : '');
    $('filelist').querySelectorAll('button').forEach(b => b.onclick = () => { files.splice(+b.dataset.i, 1); renderFiles(); });
  }
  function addFiles(list) {
    for (const f of Array.from(list || [])) {
      if (f.size > MAX) { showMsg(`${f.name}: 20MB를 초과해 제외했습니다.`, false); continue; }
      if (!files.some(x => x.name === f.name && x.size === f.size)) files.push(f);
    }
    files = files.slice(0, 10); renderFiles();
  }
  $('files').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('on'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('on'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('on'); addFiles(e.dataTransfer.files); });

  function showMsg(text, ok) { const m = $('fmsg'); m.style.color = ok ? '#1a9b50' : '#d33'; m.textContent = text; m.style.display = 'block'; }

  async function uploadOne(f) {
    const r = await fetch(API + '/upload-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: f.name, size: f.size }) });
    const u = await r.json();
    if (!u.ok) throw new Error(`${f.name}: ${u.error || '업로드 준비 실패'}`);
    const put = await fetch(u.uploadUrl, { method: 'PUT', headers: { 'Content-Type': f.type || 'application/octet-stream', 'apikey': u.apikey, 'Authorization': 'Bearer ' + u.apikey, 'x-upsert': 'false' }, body: f });
    if (!put.ok) throw new Error(`${f.name}: 업로드 실패 (${put.status})`);
    return { path: u.path, name: f.name };
  }

  cform.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('fbtn');
    const company = $('company').value.trim(), phone = $('phone').value.trim(), email = $('email').value.trim();
    if (!company) return showMsg(kind === '셀러' ? '채널명 또는 성함을 입력해 주세요.' : '업체명(회사명)을 입력해 주세요.', false);
    if (!phone) return showMsg('연락처를 입력해 주세요.', false);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showMsg('올바른 이메일을 입력해 주세요.', false);
    if (kind === '공급사' && files.length === 0) return showMsg('상품·회사 제안서를 1개 이상 첨부해 주세요.', false);
    if (!$('fagree').checked) return showMsg('개인정보 수집·이용에 동의해 주세요.', false);
    btn.disabled = true; btn.textContent = '전송 중...';
    try {
      const uploaded = kind === '공급사' ? await Promise.all(files.map(uploadOne)) : [];
      const topic = kind === '공급사' ? $('topicSupplier').value : kind === '제휴' ? $('topicPartner').value : kind === '제작' ? $('topicBuild').value : '';
      const extraLines = kind === '제작' && $('refUrl').value.trim() ? ['참고 사이트: ' + $('refUrl').value.trim()] : [];
      const body = { kind, topic, company, contactName: $('contactName').value.trim(), phone, email, message: $('message').value.trim(),
        snsTypes: kind === '셀러' ? [...snsSel] : [], snsLink: kind === '셀러' ? $('snsLink').value.trim() : '', files: uploaded, hp: $('hp').value, extraLines };
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({ ok: false }));
      if (!j.ok) throw new Error(j.error || '접수 실패');
      showMsg(j.message || '문의가 접수되었습니다. 영업일 기준 24시간 내 답변드리겠습니다.', true);
      cform.reset(); files = []; renderFiles(); snsSel.clear(); document.querySelectorAll('#sns button').forEach(b => b.classList.remove('on')); setKind(kind);
    } catch (err) {
      // 접수 API 장애 시 메일 앱으로 폴백
      const subject = encodeURIComponent(`[홈페이지 문의] ${kind} - ${company}`);
      const text = encodeURIComponent(`문의 유형: ${kind}\n업체/채널: ${company}\n연락처: ${phone}\n이메일: ${email}\n\n${$('message').value.trim()}`);
      showMsg((err && err.message ? err.message + ' — ' : '') + '접수 서버에 연결하지 못했습니다. 메일 앱이 열리면 그대로 보내주세요.', false);
      setTimeout(() => { location.href = `mailto:${CONFIG.email}?subject=${subject}&body=${text}`; }, 800);
    }
    btn.disabled = false; btn.innerHTML = '문의 보내기 <svg class="ic"><use href="#i-arrow"/></svg>';
  });
}
</script>
</body>
</html>
